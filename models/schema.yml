models:
  - name: dim_listings_cleansed
    description: '{{doc("dim_listings_cleansed")}}'
    data_tests:
      - minimum_row_count:
          arguments:
            min_rows: 1000 # test failure
          # severity: error
    columns:
      - name: listing_id
        description: "Unique identifier for each listing"
        data_tests:
          - unique
          - not_null
      - name: host_id
        description: "Foreign key referencing the host of the listing"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: "The type of room being offered (e.g., Entire home/apt, Private room, Shared room)"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      - name: minimum_nights
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: '{{ doc("dim_hosts_cleansed") }}'
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        data_type: integer
      - name: host_name
        description: "Name of the host."
        data_type: string
      - name: is_superhost
        description: "Indicates if the host is a superhost."
        data_type: string
      - name: created_at
        description: "Record creation timestamp."
        data_type: timestamp
      - name: updated_at
        description: "Record update timestamp."
        data_type: timestamp
  
  - name: dim_listings_with_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
                config:
                  severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number